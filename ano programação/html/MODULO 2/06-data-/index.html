MÓDULO 2 — DATA-*

Os atributos "data-*" permitem criar atributos personalizados para
armazenar informações extras em elementos HTML.

Eles sempre começam com "data-".

Exemplo:
<div data-id="123">Produto</div>

Nesse caso, "data-id" guarda a informação "123".
