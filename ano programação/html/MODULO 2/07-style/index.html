    <!--
MÓDULO 2 — STYLE

O atributo "style" permite adicionar estilos CSS diretamente
dentro de uma tag HTML.

Ele pode ser usado para alterar características visuais do elemento,
como cor, tamanho e fundo.

Exemplo:
<p style="color: blue;">Texto azul</p>

Nesse caso, o texto será exibido na cor azul.
-->
