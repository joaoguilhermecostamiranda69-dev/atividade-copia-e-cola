MÓDULO 2 — CLASS

O atributo "class" é utilizado para agrupar elementos que possuem
uma mesma característica.

Uma mesma classe pode ser utilizada em vários elementos.

Exemplo:
<p class="texto">Primeiro texto</p>
<p class="texto">Segundo texto</p>

Os dois elementos possuem a classe "texto".
-->
