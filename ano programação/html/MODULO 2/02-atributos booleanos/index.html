MÓDULO 2 — ATRIBUTOS BOOLEANOS

Atributos booleanos são atributos que possuem apenas dois estados:
presente ou ausente.

Quando o atributo está presente, ele é considerado ativado.
Não é necessário informar um valor.

Exemplo:
<input type="text" disabled>

O atributo "disabled" faz com que o campo fique desativado.
