MÓDULO 2 — ID

O atributo "id" serve para identificar um elemento de forma única
dentro de uma página HTML.

Um mesmo "id" não deve ser utilizado em vários elementos.

Exemplo:
<p id="titulo">Meu texto</p>

Nesse caso, o elemento possui o ID "titulo".
