       <!--
MÓDULO 1 — ANATOMIA DAS TAGS

As tags são usadas para criar e organizar os elementos de uma página HTML.
Geralmente, uma tag possui uma abertura, um conteúdo e um fechamento.

Exemplo:
<p>Olá, mundo!</p>

<p> é a tag de abertura.
"Olá, mundo!" é o conteúdo.
</p> é a tag de fechamento.
