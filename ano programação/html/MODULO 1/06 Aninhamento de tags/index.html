MÓDULO 1 — ANINHAMENTO DE TAGS

O aninhamento acontece quando colocamos uma tag dentro de outra.
É importante fechar as tags na ordem correta para manter a estrutura
do documento organizada.

Exemplo:
<p>Este é um <strong>texto importante</strong>.</p>

A tag <strong> está dentro da tag <p>.
-->
