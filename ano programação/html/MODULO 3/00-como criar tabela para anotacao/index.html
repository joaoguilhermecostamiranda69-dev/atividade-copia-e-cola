    <!--
MÓDULO 3 — COMO CRIAR UMA TABELA PARA ANOTAÇÃO

As tabelas HTML são utilizadas para organizar informações em linhas
e colunas.

As principais tags são:
<table> — cria a tabela.
<tr> — cria uma linha.
<th> — cria uma célula de cabeçalho.
<td> — cria uma célula de conteúdo.

Exemplo:
<table>
  <tr>
    <th>Nome</th>
    <th>Idade</th>
  </tr>
  <tr>
    <td>João</td>
    <td>20</td>
  </tr>
</table>
-->
