   <!--
MÓDULO 3 — SEMÂNTICA

A semântica no HTML consiste em utilizar tags que possuem um significado
claro sobre o conteúdo que elas representam.

Exemplos:
<header> — cabeçalho.
<nav> — área de navegação.
<main> — conteúdo principal.
<section> — seção de conteúdo.
<article> — conteúdo independente.
<footer> — rodapé.

O uso correto das tags semânticas ajuda na organização e acessibilidade
da página.
