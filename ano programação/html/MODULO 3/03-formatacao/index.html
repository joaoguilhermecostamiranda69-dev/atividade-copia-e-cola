MÓDULO 3 — FORMATAÇÃO BÁSICA DE TEXTOS

Existem tags que podem ser utilizadas para dar significado ou destaque
a determinadas partes de um texto.

<strong> — indica importância.
<em> — indica ênfase.
<mark> — destaca um trecho.
<small> — representa um texto menor.
<del> — representa um texto removido.
<ins> — representa um texto inserido.

Exemplo:
<p><strong>Texto importante</strong></p>
<p><em>Texto com ênfase</em></p>
<p><mark>Texto destacado</mark></p>
-->
