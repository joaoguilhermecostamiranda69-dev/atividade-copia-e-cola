MÓDULO 3 — LISTAS

As listas servem para organizar informações em sequência.

<ul> cria uma lista não ordenada, geralmente com marcadores.
<ol> cria uma lista ordenada, geralmente com números.
<li> representa cada item da lista.

Exemplo:
<ul>
  <li>Arroz</li>
  <li>Feijão</li>
  <li>Car</li>
