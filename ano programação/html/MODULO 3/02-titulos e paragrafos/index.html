MÓDULO 3 — TÍTULOS E PARÁGRAFOS

Os títulos são utilizados para organizar o conteúdo de uma página.

O HTML possui títulos de <h1> até <h6>, sendo <h1> o título de maior
importância e <h6> o de menor importância.

A tag <p> é utilizada para criar parágrafos.

Exemplo:
<h1>Meu título</h1>
<p>Este é um parágrafo.</p>
